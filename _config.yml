title: Páez Math
description: Personal page of Walter Andrés Páez Gaviria — mathematics, languages and more.
author: Walter Andrés Páez Gaviria

# Giscus comments (fill these in from https://giscus.app after enabling Discussions)
# Comments stay hidden until repo_id and category_id are both set.
giscus:
  repo: wapaezg/webpage
  repo_id: "R_kgDOSUH0nA"
  category: "Announcements"
  category_id: "DIC_kwDOSUH0nM4DKebZ"

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  math_engine: null   # We render math with MathJax in the browser, not at build time

# Permalinks for blog posts: /blog/2026/11/05/my-post-title/
permalink: /blog/:year/:month/:day/:title/

# Collections / defaults
defaults:
  - scope:
      path: "_posts"
      type: posts
    values:
      layout: post
      math: true

# Files Jekyll should not copy into the built site
exclude:
  - optimize_images.py
  - Gemfile
  - Gemfile.lock
  - README.md
